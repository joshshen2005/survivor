<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">
<title>最后防线 · 黑夜围城</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;background:#080b10;color:#e5edf5;
  font-family:system-ui,"Microsoft YaHei",sans-serif
}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
button,a{touch-action:manipulation}
button{
  color:#dce9f3;background:#202c38;border:1px solid #ffffff20;
  border-radius:9px;padding:9px 13px
}
button:hover:not(:disabled){background:#304252}
button.primary{background:#d2a86e;color:#201b15;font-weight:800}
#app{
  height:100dvh;max-width:1600px;margin:auto;display:grid;
  grid-template-rows:76px minmax(0,1fr) 25px
}
header{
  display:flex;gap:16px;align-items:center;padding:9px 16px;
  background:linear-gradient(90deg,#17212c,#0d141e);
  border-bottom:1px solid #ffffff12
}
.brand{color:#f2d5a6;font-size:19px;font-weight:900;white-space:nowrap}
#hud{flex:1;min-width:160px;display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(120px,1fr);gap:5px 12px}
.hud-line{display:flex;align-items:center;gap:9px;min-width:0;font-size:12px;color:#adbfce}
.hud-line.wide{grid-column:1/-1}
.meter{height:9px;min-width:70px;flex:1;overflow:hidden;border-radius:99px;background:#05080c;border:1px solid #ffffff18}
.meter i{display:block;height:100%;width:0;transition:width .15s;background:linear-gradient(90deg,#7abb91,#b7e1bf)}
.meter.xp i{background:linear-gradient(90deg,#6e8fc3,#a9c8ef)}
.hud-value{font-weight:750;color:#e8f0f6;white-space:nowrap}
.hud-gold{color:#f2cb82;font-weight:800}.hud-time{color:#d9e6ef;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px}
#prep{position:relative;border-color:#d8b77988;background:linear-gradient(135deg,#77562b,#34291d);color:#ffe1a4;font-weight:900}
#prep.affordable{box-shadow:0 0 0 2px #e9bd6640,0 0 18px #d99c3f55;animation:pulse 1.8s ease-in-out infinite}
#prep .dot{display:none;position:absolute;right:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:#78dda0;box-shadow:0 0 8px #78dda0}
#prep.affordable .dot{display:block}
@keyframes pulse{50%{filter:brightness(1.18)}}
#battle{display:grid;grid-template-rows:minmax(0,1fr);min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:#090e14}
#game{display:block;width:100%;height:100%;touch-action:none}
#message{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  max-width:90%;text-align:center;padding:9px 20px;
  background:#101b27dc;border:1px solid #c9a57055;
  border-radius:9px;color:#f1d4a4;font-size:13px;
  pointer-events:none;opacity:0;transition:opacity .2s
}
#actions{
  position:absolute;right:17px;bottom:18px;display:flex;gap:9px
}
#actions button{
  width:76px;height:76px;border-radius:50%;background:#122332cf;
  border:2px solid #91b8c5;color:#d2f3f2;white-space:pre-line;
  font-size:12px;touch-action:none
}
#actions #skill{border-color:#d8b779;color:#f4dcb3}
footer{
  padding:4px 14px;font-size:10px;background:#090e15;color:#647d91;
  overflow:hidden;white-space:nowrap
}
#overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#04070bd9;
  backdrop-filter:blur(9px)
}
#overlay[hidden]{display:none}
#overlay.is-resuming{background:#07111b26;backdrop-filter:none;align-items:flex-start;padding-top:86px}
.panel{
  width:min(930px,98vw);max-height:94dvh;overflow:auto;
  padding:26px;border:1px solid #a9b8c533;border-radius:18px;
  background:linear-gradient(140deg,#202d39,#0e1721);
  box-shadow:0 30px 100px #0009
}
.panel.shop-panel{width:min(1040px,98vw)}
.shop-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px}
.shop-balance{color:#f3ce88;font-size:18px;font-weight:900;white-space:nowrap}
.freeze-note{margin:12px 0 4px;padding:10px 13px;border:1px solid #79a8bd45;border-radius:9px;background:#0b1822;color:#b9d5df;font-size:12px}
.shop-stats{display:flex;gap:8px 22px;flex-wrap:wrap;margin:14px 0 0;color:#b5c9d8;font-size:12px}
.shop-stats b{color:#b8e5c5}
.upgrade-desc{font-size:11px;line-height:1.5;color:#a6bdce;min-height:33px}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:16px 0}
.upgrade{position:relative;text-align:left;min-height:142px;padding:14px;background:linear-gradient(145deg,#233442,#121c27);border-color:#ffffff1b}
.upgrade:hover:not(:disabled){border-color:#d8b779;background:linear-gradient(145deg,#2c4352,#182634)}
.upgrade h3{margin:3px 0 6px;font-size:16px}.upgrade .key{float:right;color:#829aaa;font-size:11px}
.upgrade .level{font-size:11px;color:#d2b981}.upgrade .change{margin:11px 0;color:#dceaf1;font-size:13px}
.upgrade .arrow{color:#79d49c;margin:0 5px}.upgrade .cost{color:#f1ca82;font-weight:850}
.upgrade .state{display:block;margin-top:7px;font-size:11px;color:#8fa8ba}
.upgrade.broke .state{color:#e48d84}.upgrade.maxed .state{color:#aab5bd}
.shop-footer{position:sticky;bottom:-26px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:#15212c;padding:12px 0;margin-top:8px}
#shop-feedback{min-height:20px;color:#e7b581;font-size:13px}
.resume-panel{text-align:center;width:min(360px,90vw);padding:14px;background:#101a24e8}
.resume-count{font-size:48px;line-height:1;font-weight:950;color:#f2ce91;text-shadow:0 0 30px #e2a74566;margin:8px}
h1,h2{margin:5px 0 12px}
h1{font-size:34px}h2{font-size:27px}
.eyebrow{color:#c7ab7d;font-size:11px;letter-spacing:4px}
.muted{color:#91a7b9;font-size:13px;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.heroes{grid-template-columns:repeat(4,1fr)}
.card{
  background:#ffffff04;border:1px solid #ffffff1c;
  border-radius:12px;padding:17px;text-align:left;color:#dce9f3
}
button.card:hover{border-color:#d8b779;background:#ffffff0b}
.card h3{margin:7px 0}
.card p{font-size:12px;line-height:1.8;color:#9eb6c7}
.card canvas{display:block;width:100%;height:90px}
.card .tag{color:#d4b982;font-size:11px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.codex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.codex .card{display:flex;gap:12px}
.codex canvas{width:78px;height:85px;flex-shrink:0}
a{color:#bdd7e3}
@media(max-width:850px){
  header{gap:10px;padding:8px}
  .brand{font-size:14px}
  #hud{gap:4px 8px}.hud-line{font-size:10px;gap:5px}
  .tools button{padding:7px;font-size:11px}
  .panel{padding:18px}
  .shop-footer{bottom:-18px}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
  .heroes{grid-template-columns:repeat(2,1fr)}
  #actions button{width:62px;height:62px}
}
@media(max-width:550px){
  #app{grid-template-rows:104px minmax(0,1fr) 20px}
  header{align-items:flex-start;flex-wrap:wrap;gap:5px}
  .brand{display:none}
  #hud{order:2;flex-basis:100%;grid-template-columns:1fr 1fr}
  .tools{margin-left:auto}.tools button{padding:6px 7px}
  #prep{order:-1}
  .cards,.codex{grid-template-columns:1fr}
  .shop-grid{grid-template-columns:1fr;gap:8px}.upgrade{min-height:118px}
  .shop-head{align-items:flex-start}.shop-balance{font-size:15px}
  .heroes{grid-template-columns:repeat(2,1fr)}
  .card{padding:11px}
  .panel{padding:15px}
  .shop-footer{bottom:-15px}
  #overlay.is-resuming{padding-top:110px}
  #actions{right:6px;bottom:8px;gap:5px}
  #actions button{width:53px;height:53px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">最后防线 / 黑夜围城</div>
    <div id="hud">
      <div class="hud-line"><span class="hud-value" id="hp-label">生命 --</span><span class="meter"><i id="hp-fill"></i></span></div>
      <div class="hud-line"><span class="hud-value" id="level-label">Lv.--</span><span class="meter xp"><i id="xp-fill"></i></span></div>
      <div class="hud-line wide"><span class="hud-gold" id="coin-label">金币 --</span><span class="hud-time" id="time-label">00:00</span><span id="battle-label">正在初始化……</span></div>
    </div>
    <button id="prep">整备 <u>B</u><span class="dot"></span></button>
    <div class="tools">
      <button id="audio">音效：开</button>
      <button id="codex">图鉴</button>
      <button id="pause">暂停</button>
    </div>
  </header>

  <div id="battle">
    <main id="stage">
      <canvas id="game"></canvas>
      <div id="message"></div>
      <div id="actions">
        <button id="dash">闪避</button>
        <button id="skill">技能</button>
      </div>
    </main>
  </div>

  <footer>
    Art: Riley Gombart · Survivor: CC BY 3.0 · Zombie: CC0 ·
    2D animation / local assets
  </footer>
</div>

<div id="overlay">
  <div id="panel" class="panel">正在加载……</div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
