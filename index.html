<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">
<title>最后防线 · 黑夜围城</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;background:#080b10;color:#e5edf5;
  font-family:system-ui,"Microsoft YaHei",sans-serif
}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.4}
button,a{touch-action:manipulation}
button{
  color:#dce9f3;background:#202c38;border:1px solid #ffffff20;
  border-radius:9px;padding:9px 13px
}
button:hover:not(:disabled){background:#304252}
button.primary{background:#d2a86e;color:#201b15;font-weight:800}
#app{
  height:100dvh;max-width:1600px;margin:auto;display:grid;
  grid-template-rows:66px minmax(0,1fr) 25px
}
header{
  display:flex;gap:22px;align-items:center;padding:10px 18px;
  background:linear-gradient(90deg,#17212c,#0d141e);
  border-bottom:1px solid #ffffff12
}
.brand{color:#f2d5a6;font-size:19px;font-weight:900;white-space:nowrap}
#hud{flex:1;font-size:13px;color:#adbfce;line-height:1.7}
.tools{display:flex;gap:6px}
#battle{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0}
aside{
  padding:13px 10px;background:#0c131c;border-right:1px solid #ffffff10;
  overflow:auto
}
aside h3{font-size:14px;margin:0 0 11px;color:#dfc49a}
#shop{display:grid;gap:8px}
.shop{
  text-align:left;min-height:66px;padding:10px;
  background:linear-gradient(130deg,#20303d,#141e2a)
}
.shop b{display:block;font-size:13px}
.shop small{display:block;color:#92abbd;margin-top:5px;font-size:11px}
.shop em{float:right;color:#f1ce8c;font-style:normal}
.note{font-size:11px;color:#7c93a6;line-height:1.8;margin-top:12px}
#stage{position:relative;min-width:0;min-height:0;background:#090e14}
#game{display:block;width:100%;height:100%;touch-action:none}
#message{
  position:absolute;top:13px;left:50%;transform:translateX(-50%);
  max-width:90%;text-align:center;padding:9px 20px;
  background:#101b27dc;border:1px solid #c9a57055;
  border-radius:9px;color:#f1d4a4;font-size:13px;
  pointer-events:none;opacity:0;transition:opacity .2s
}
#actions{
  position:absolute;right:17px;bottom:18px;display:flex;gap:9px
}
#actions button{
  width:76px;height:76px;border-radius:50%;background:#122332cf;
  border:2px solid #91b8c5;color:#d2f3f2;white-space:pre-line;
  font-size:12px;touch-action:none
}
#actions #skill{border-color:#d8b779;color:#f4dcb3}
footer{
  padding:4px 14px;font-size:10px;background:#090e15;color:#647d91;
  overflow:hidden;white-space:nowrap
}
#overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#04070bd9;
  backdrop-filter:blur(9px)
}
#overlay[hidden]{display:none}
.panel{
  width:min(930px,98vw);max-height:94dvh;overflow:auto;
  padding:26px;border:1px solid #a9b8c533;border-radius:18px;
  background:linear-gradient(140deg,#202d39,#0e1721);
  box-shadow:0 30px 100px #0009
}
h1,h2{margin:5px 0 12px}
h1{font-size:34px}h2{font-size:27px}
.eyebrow{color:#c7ab7d;font-size:11px;letter-spacing:4px}
.muted{color:#91a7b9;font-size:13px;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.heroes{grid-template-columns:repeat(4,1fr)}
.card{
  background:#ffffff04;border:1px solid #ffffff1c;
  border-radius:12px;padding:17px;text-align:left;color:#dce9f3
}
button.card:hover{border-color:#d8b779;background:#ffffff0b}
.card h3{margin:7px 0}
.card p{font-size:12px;line-height:1.8;color:#9eb6c7}
.card canvas{display:block;width:100%;height:90px}
.card .tag{color:#d4b982;font-size:11px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.codex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
.codex .card{display:flex;gap:12px}
.codex canvas{width:78px;height:85px;flex-shrink:0}
a{color:#bdd7e3}
@media(max-width:850px){
  #battle{grid-template-columns:145px minmax(0,1fr)}
  header{gap:10px;padding:8px}
  .brand{font-size:14px}
  #hud{font-size:11px}
  .tools button{padding:7px;font-size:11px}
  .shop{padding:8px}.shop b{font-size:11px}.shop small{font-size:10px}
  .panel{padding:18px}
  .heroes{grid-template-columns:repeat(2,1fr)}
  #actions button{width:62px;height:62px}
}
@media(max-width:550px){
  #app{grid-template-rows:76px minmax(0,1fr) 22px}
  #battle{grid-template-columns:112px minmax(0,1fr)}
  .brand{display:none}
  .cards,.codex{grid-template-columns:1fr}
  .heroes{grid-template-columns:repeat(2,1fr)}
  .card{padding:11px}
  .panel{padding:15px}
  #actions{right:6px;bottom:8px;gap:5px}
  #actions button{width:53px;height:53px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">最后防线 / 黑夜围城</div>
    <div id="hud">正在初始化……</div>
    <div class="tools">
      <button id="audio">音效：关</button>
      <button id="codex">图鉴</button>
      <button id="pause">暂停</button>
    </div>
  </header>

  <div id="battle">
    <aside>
      <h3>战地补给</h3>
      <div id="shop"></div>
      <div class="note">
        金币升级不会暂停战斗。<br>
        WASD：移动<br>
        Shift：闪避<br>
        Q / E：角色技能<br>
        按住鼠标右键：手动瞄准<br>
        空格：暂停<br><br>
        手机使用左下摇杆。<br>
        建议横屏游玩。
      </div>
    </aside>

    <main id="stage">
      <canvas id="game"></canvas>
      <div id="message"></div>
      <div id="actions">
        <button id="dash">闪避</button>
        <button id="skill">技能</button>
      </div>
    </main>
  </div>

  <footer>
    Art: Riley Gombart · Survivor: CC BY 3.0 · Zombie: CC0 ·
    2D animation / local assets
  </footer>
</div>

<div id="overlay">
  <div id="panel" class="panel">正在加载……</div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
